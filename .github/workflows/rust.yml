name: Rust tests, WASM and SPKG
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test
      - name: Compile WASM
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Install Substreams CLI
        run: |
          curl --fail --location --retry 3 -o /tmp/substreams.tar.gz https://github.com/streamingfast/substreams/releases/download/v1.27.0/substreams_linux_x86_64.tar.gz
          tar -xzf /tmp/substreams.tar.gz -C /tmp
          sudo install -m 0755 /tmp/substreams /usr/local/bin/substreams
          substreams --version
      - name: Package SPKG
        run: |
          substreams pack substreams.yaml
          ls -lh *.spkg
      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: solana-substreams-submission
          path: |
            *.spkg
            target/wasm32-unknown-unknown/release/solana_transfer_extractor.wasm
